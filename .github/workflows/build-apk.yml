name: Build ArtisanFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Décompresser ArtisanFlow
        run: |
          mkdir project
          unzip -q ArtisanFlow_GitHubActions_V1.zip -d project

      - name: Compiler l'application
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanFlow-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
