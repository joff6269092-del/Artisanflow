name: Build ArtisanFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Décompresser ArtisanFlow
        run: |
          rm -rf project
          mkdir project
          unzip -q ArtisanFlow_GitHubActions_V1.zip -d project

      - name: Compiler ArtisanFlow
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanFlow-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
